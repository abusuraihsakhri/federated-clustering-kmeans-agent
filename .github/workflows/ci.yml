name: Federated Clustering Kmeans Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[api,test]"

    - name: Run Pytest Suite
      run: |
        python -m compileall -q agents fed_kmeans cli.py simulator.py enrichment.py
        python -m pytest -q

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Validate browser simulator
      run: |
        node --check cluster.js
        node --test tests/cluster.test.cjs

    - name: Dependency vulnerability audit
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install pip-audit
        pip-audit

    - name: Static Python security scan
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install bandit
        bandit -q -ll -r agents fed_kmeans cli.py enrichment.py simulator.py

    - name: Audit-chain integrity smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
